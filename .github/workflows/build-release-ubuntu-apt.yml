###############################################################################
# Build and release to Ubuntu APT repository
# https://launchpad.net/~lpm0073/+archive/ubuntu/smarter-cli
###############################################################################
name: Build-Release Ubuntu APT

on:
  workflow_dispatch:

env:
    container_name: smarter-cli
    account: lpm0073
    ppa: smarter-cli

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Install packaging tools
      shell: bash
      run: |
        sudo grep -rl "dl.google.com/linux/chrome" /etc/apt/sources.list.d/ 2>/dev/null | xargs -r sudo rm -f
        sudo apt-get update
        sudo apt-get install -y devscripts dput build-essential debhelper

    - name: Import GPG key
      shell: bash
      run: |
        echo "$GPG_PRIVATE_KEY" | gpg --batch --import
        mkdir -p ~/.gnupg
        echo "allow-loopback-pinentry" >> ~/.gnupg/gpg-agent.conf
        gpgconf --kill gpg-agent
        echo "priming gpg-agent passphrase cache" | gpg --batch --yes --pinentry-mode loopback --passphrase "$GPG_PASSPHRASE" --local-user lpm0073@gmail.com --clearsign > /dev/null
      env:
        GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

    - name: Update debian changelog
      shell: bash
      run: |
        VERSION=$(cat VERSION)
        export DEBEMAIL="lpm0073@gmail.com"
        export DEBFULLNAME="Lawrence McDaniel"
        dch --newversion "${VERSION}-1" --distribution unstable --force-distribution "Release ${VERSION}"

    - name: Create original source tarball
      shell: bash
      run: |
        VERSION=$(cat VERSION)
        cd ..
        tar czf smarter-cli_${VERSION}.orig.tar.gz --exclude=debian --exclude=.git smarter-cli
        cd smarter-cli

    - name: Build source package
      shell: bash
      run: |
        debuild -kFB3400542F8EEE85986FA02258F2087CD4DA3ADD -S -sa

    - name: Get version
      id: vars
      shell: pwsh
      run: echo "::set-output name=version::$(Get-Content -Path VERSION)"

    - name: Publish to PPA
      shell: bash
      run: |
        dput ppa:${{ env.account }}/${{ env.ppa }} smarter-cli_${{ steps.vars.outputs.version }}-1_source.changes
