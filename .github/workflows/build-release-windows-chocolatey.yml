###############################################################################
# Build and release to the Chocolatey Community Repository
# https://community.chocolatey.org/packages/smarter
#
# This workflow builds the `smarter` CLI binary for Windows, packs it into a
# Chocolatey package using chocolatey/smarter/smarter.nuspec, and pushes it
# to the Chocolatey community feed.
#
# Required repo/org secrets
# --------------------------
#   CHOCO_API_KEY   The API key for the Chocolatey.org account that owns the
#                    `smarter` package. Used by `choco push` to authenticate
#                    the upload.
#
# If CHOCO_API_KEY ever needs to be (re)created, e.g. it expired or was
# rotated:
#
#   1. Sign in at https://community.chocolatey.org and generate/copy the API
#      key from your account profile (https://community.chocolatey.org/account).
#
#   2. Push it to GitHub as a repo secret (requires the gh CLI,
#      authenticated):
#        gh secret set CHOCO_API_KEY --repo lpm0073/smarter-cli
#          # (prompts for the key value interactively)
###############################################################################
name: Build-Release Chocolatey

on:
  workflow_dispatch:

env:
  app_name: smarter

jobs:
  build:
    name: Build
    runs-on: windows-latest
    steps:
    - name: Check out code
      uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v5

    - name: Cache Go dependencies
      uses: actions/cache@v6
      with:
        path: ~\go\pkg\mod
        key: ${{ runner.os }}-go-${{ hashFiles('**\go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-

    - name: Go Get dependencies
      shell: pwsh
      run: go get -v -t .\...

    - name: Echo Build Path
      shell: pwsh
      run: |
        echo ${{ github.workspace }}\chocolatey\smarter\build\windows\smarter.exe

    - name: Go Build
      shell: pwsh
      run: |
        go build -v -o ${{ github.workspace }}\chocolatey\smarter\build\windows\smarter.exe

    - name: Echo Built Path
      shell: pwsh
      run: |
        Get-ChildItem -Force -Recurse ${{ github.workspace }}\chocolatey\smarter\build\windows\ | Select-Object FullName, Length

    - name: Get version
      id: vars
      shell: pwsh
      run: echo "::set-output name=version::$(Get-Content -Path VERSION)"

    - name: Pack Chocolatey package
      run: |
        choco pack .\chocolatey\smarter\smarter.nuspec --version ${{ steps.vars.outputs.version }}
      shell: pwsh

    - name: Push Chocolatey package
      shell: pwsh
      run: |
        choco push ${{ env.app_name }}.${{ steps.vars.outputs.version }}.nupkg --source https://push.chocolatey.org/ --api-key $env:CHOCO_API_KEY
      env:
        CHOCO_API_KEY: ${{ secrets.CHOCO_API_KEY }}
